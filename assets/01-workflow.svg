<svg xmlns="http://www.w3.org/2000/svg" width="560" height="610" viewBox="0 0 560 610" role="img" aria-labelledby="title desc">
<title id="title">流程、接入与交付</title><desc id="desc">技能的流程材料和用户目标交给模型与宿主，宿主通过MCP客户端与服务端到达画境服务；文件返回以后，仍需验收。CLI或HTTP脚本也可接同一服务。</desc>
<defs><pattern id="paper" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="2" cy="3" r=".55" fill="#c8bc9c" opacity=".28"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1l7 4-7 4" fill="none" stroke="#2c4a7c" stroke-width="1.5"/></marker></defs>
<rect width="560" height="610" fill="#fffcf4"/><rect width="560" height="610" fill="url(#paper)"/>
<g font-family="Microsoft YaHei, sans-serif" fill="#23282a">
<text x="28" y="35" font-size="13" fill="#a95f16" letter-spacing="1.8">ONE TASK / 一张文章插图</text>
<rect x="26" y="57" width="243" height="101" rx="6" fill="#e4ebf2" stroke="#2c4a7c" stroke-width="1.5"/><text x="43" y="89" font-size="23" fill="#2c4a7c">Skill：怎样做</text><text x="43" y="118" font-size="18">流程 · 脚本 · 参考</text><text x="43" y="143" font-size="15" fill="#6a7168">先发现，再按需读取</text>
<rect x="291" y="57" width="243" height="101" rx="6" fill="#f6e6d2" stroke="#a95f16" stroke-width="1.5"/><text x="308" y="89" font-size="23" fill="#a95f16">目标：这次做什么</text><text x="308" y="118" font-size="18">用途 · 比例 · 画风</text><text x="308" y="143" font-size="15" fill="#6a7168">来自当前任务与分镜</text>
<g stroke="#2c4a7c" stroke-width="1.8" fill="none" marker-end="url(#arrow)"><path d="M146 159v22h80v21"/><path d="M413 159v22h-80v21"/></g>
<rect x="26" y="205" width="508" height="79" rx="6" fill="#fffcf4" stroke="#2c4a7c" stroke-width="1.8"/><text x="44" y="237" font-size="23" fill="#2c4a7c">模型与宿主：选择、加载、执行</text><text x="44" y="267" font-size="17">组装参数，按可用接口调用，回填结果</text>
<path d="M146 286v30" fill="none" stroke="#2c4a7c" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="26" y="323" width="241" height="73" rx="6" fill="#e4ebf2" stroke="#2c4a7c"/><text x="44" y="353" font-size="22" fill="#2c4a7c">MCP 客户端</text><text x="44" y="379" font-size="16">发现工具，发出调用</text>
<rect x="293" y="323" width="241" height="73" rx="6" fill="#e4ebf2" stroke="#2c4a7c"/><text x="311" y="353" font-size="22" fill="#2c4a7c">MCP 服务端</text><text x="311" y="379" font-size="16">stdio 薄代理</text>
<path d="M267 359h24" fill="none" stroke="#2c4a7c" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M413 398v24h-133v20" fill="none" stroke="#2c4a7c" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="31" y="428" font-size="15" fill="#6a7168">CLI / HTTP 脚本也可接到这里</text>
<rect x="26" y="448" width="508" height="69" rx="6" fill="#f6e6d2" stroke="#a95f16" stroke-width="1.5"/><text x="44" y="478" font-size="23" fill="#a95f16">画境 HTTP → GPT 生图渠道</text><text x="44" y="503" font-size="16">任务编号 · 业务状态 · 保存的图片文件</text>
<path d="M280 519v22" fill="none" stroke="#2c4a7c" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="26" y="547" width="508" height="45" rx="5" fill="#23282a"/><text x="44" y="577" font-size="21" fill="#fffcf4">验文件 → 看画面 → 集成文章 → 交付</text>
</g></svg>
